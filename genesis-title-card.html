<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENESIS — Title Card (1:24-1:27)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #000000;
            font-family: 'Arial Black', 'Arial Bold', sans-serif;
        }

        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Subtle particle effect */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            animation: fadeInParticles 2s ease-in 0.3s forwards;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }

        /* Main title */
        .title {
            font-size: 240px;
            font-weight: 900;
            letter-spacing: 35px;
            color: #ffffff;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.5),
                         0 0 80px rgba(255, 255, 255, 0.3),
                         0 0 120px rgba(255, 255, 255, 0.2),
                         0 6px 12px rgba(0, 0, 0, 0.9);
            opacity: 0;
            animation: revealTitle 2s cubic-bezier(0.4, 0, 0.2, 1) 0.5s forwards;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Decorative lines */
        .line-left, .line-right {
            position: absolute;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.6), transparent);
            top: 50%;
            opacity: 0;
            animation: revealLine 1.5s ease-out 1s forwards;
        }

        .line-left {
            left: 100px;
            right: 55%;
        }

        .line-right {
            left: 55%;
            right: 100px;
        }

        /* Subtle glow pulse */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            animation: pulseGlow 3s ease-in-out 0.5s infinite;
        }

        /* Animations */
        @keyframes fadeInParticles {
            to { opacity: 0.4; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            25% { transform: translateY(-20px) translateX(10px); }
            50% { transform: translateY(-40px) translateX(-10px); }
            75% { transform: translateY(-20px) translateX(15px); }
        }

        @keyframes revealTitle {
            0% {
                opacity: 0;
                transform: scale(0.7);
                letter-spacing: 60px;
            }
            50% {
                opacity: 0.7;
                letter-spacing: 40px;
            }
            100% {
                opacity: 1;
                transform: scale(1);
                letter-spacing: 35px;
            }
        }

        @keyframes revealLine {
            from {
                opacity: 0;
                transform: scaleX(0);
            }
            to {
                opacity: 1;
                transform: scaleX(1);
            }
        }

        @keyframes pulseGlow {
            0%, 100% { 
                opacity: 0.3;
                transform: scale(1);
            }
            50% { 
                opacity: 0.5;
                transform: scale(1.1);
            }
        }

        /* Recording hint */
        .recording-hint {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .recording-hint button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            display: block;
            width: 100%;
            font-weight: bold;
        }

        .recording-hint button:hover {
            background: #dddddd;
        }
    </style>
</head>
<body>
    <div class="recording-hint">
        <strong>📹 GENESIS Title Card</strong><br>
        Duration: 3 seconds (1:24-1:27)<br>
        Resolution: 1920×1080 @ 60 FPS<br>
        <button onclick="this.parentElement.style.display='none'">Hide This</button>
    </div>

    <div class="scene">
        <!-- Background glow -->
        <div class="glow"></div>

        <!-- Particles -->
        <div class="particles">
            <div class="particle" style="width: 3px; height: 3px; top: 20%; left: 15%; animation-delay: 0s;"></div>
            <div class="particle" style="width: 2px; height: 2px; top: 30%; left: 75%; animation-delay: 1s;"></div>
            <div class="particle" style="width: 4px; height: 4px; top: 60%; left: 25%; animation-delay: 2s;"></div>
            <div class="particle" style="width: 2px; height: 2px; top: 70%; left: 85%; animation-delay: 1.5s;"></div>
            <div class="particle" style="width: 3px; height: 3px; top: 40%; left: 45%; animation-delay: 0.8s;"></div>
            <div class="particle" style="width: 2px; height: 2px; top: 80%; left: 60%; animation-delay: 2.2s;"></div>
            <div class="particle" style="width: 3px; height: 3px; top: 25%; left: 90%; animation-delay: 1.2s;"></div>
            <div class="particle" style="width: 2px; height: 2px; top: 75%; left: 10%; animation-delay: 0.5s;"></div>
        </div>

        <!-- Decorative lines -->
        <div class="line-left"></div>
        <div class="line-right"></div>

        <!-- Main title -->
        <div class="title">GENESIS</div>
    </div>
</body>
</html>
